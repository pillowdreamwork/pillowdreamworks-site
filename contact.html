<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact &amp; Book Session — PillowDreamWorks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-cream text-gray-900 flex flex-col min-h-screen">

  <header class="bg-white border-b border-purple-100 py-4 px-6 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <img src="assets/logo.svg" alt="PillowDreamWorks" class="h-10 w-auto">
      </a>
      <a href="index.html" class="text-sm text-purple-700 font-semibold hover:underline">&larr; Back to Main Site</a>
    </div>
  </header>

  <section class="py-16 max-w-3xl mx-auto px-4">
    
    <div class="text-center space-y-2 mb-8">
      <span class="bg-purple-100 text-purple-800 text-xs font-bold px-3 py-1 rounded-full uppercase">Direct Inquiry</span>
      <h1 class="text-3xl font-bold font-serif text-gray-900">Book a Session or Get in Touch</h1>
      <p class="text-sm text-gray-600">Fill out the form below to request a session or ask a question directly to Manish Garg.</p>
    </div>

    <div class="bg-white p-8 rounded-3xl border border-purple-100 shadow-xl space-y-6">
      
      <form onsubmit="event.preventDefault(); alert('Thank you! Your message has been received. Manish Garg will reach out to you within 12 hours.'); window.location.href='index.html';" class="space-y-4">
        
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Your Full Name</label>
            <input type="text" required class="w-full px-4 py-2.5 border rounded-xl text-sm" placeholder="Full Name">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
            <input type="email" required class="w-full px-4 py-2.5 border rounded-xl text-sm" placeholder="name@example.com">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">WhatsApp / Phone Number</label>
          <input type="tel" class="w-full px-4 py-2.5 border rounded-xl text-sm" placeholder="+91 98765 43210">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Select Interested Service</label>
          <select id="service-select" class="w-full px-4 py-2.5 border rounded-xl text-sm bg-white">
            <option value="counselling">Online Counselling (₹1,499)</option>
            <option value="crisis">Crisis Counselling Call (₹399)</option>
            <option value="grapho1">Graphotherapy Starter ($5 / ₹399)</option>
            <option value="grapho2">Graphotherapy Standard ($10 / ₹799)</option>
            <option value="grapho3">Graphotherapy Premium ($15 / ₹1,199)</option>
            <option value="general">General Inquiry</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Your Message or Preferred Time Slot</label>
          <textarea rows="4" required class="w-full px-4 py-2.5 border rounded-xl text-sm" placeholder="Share a little about what you're looking for..."></textarea>
        </div>

        <label class="flex items-start gap-2 text-xs text-gray-600 cursor-pointer">
          <input type="checkbox" id="contact-form-consent" required class="mt-0.5 rounded" style="accent-color: #7c3aed;">
          <span>I consent to PillowDreamWorks using my name, email, phone number, and message to respond to this inquiry and manage the requested service. I have read the <a href="privacy-policy.html" class="underline text-purple-700">Privacy Policy</a>.</span>
        </label>

        <button type="submit" class="w-full py-3.5 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow-md transition-colors text-sm">
          Submit Message &amp; Request Slot
        </button>

      </form>

    </div>

  </section>

  <script src="js/main.js"></script>
  <script>
    // Auto-select dropdown from URL parameter
    const params = new URLSearchParams(window.location.search);
    const serviceParam = params.get('service');
    if (serviceParam) {
      const select = document.getElementById('service-select');
      if (select && select.querySelector(`option[value="${serviceParam}"]`)) {
        select.value = serviceParam;
      }
    }
    lucide.createIcons();
  </script>
</body>
</html>
