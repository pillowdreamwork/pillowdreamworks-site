<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="100%" height="auto">
  <defs>
    <!-- Cloud gradients -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FB3D5"/>
      <stop offset="50%" stop-color="#5B9BD5"/>
      <stop offset="100%" stop-color="#4A7ABC"/>
    </linearGradient>
    <linearGradient id="pillowDreamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D30"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>

    <!-- Cloud inner detail gradient -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.8)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Soft shadow -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="2" dy="2" result="offsetBlur"/>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cloud mark - abstract, serene -->
  <g transform="translate(20,20)" filter="url(#softShadow)">
    <!-- Main cloud body -->
    <path d="M60 40
             C75 25 105 25 120 40
             C145 55 145 85 120 100
             C95 115 65 115 40 100
             C15 85 15 55 40 40
             Z"
          fill="url(#cloudGrad)" stroke="none"/>

    <!-- Inner connection line - represents the centre/calm -->
    <path d="M60 45 Q80 60 100 45"
          fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Soft highlight -->
    <circle cx="75" cy="35" r="8" fill="url(#innerGlow)"/>

    <!-- Delicate center point -->
    <circle cx="80" cy="50" r="2.5" fill="#E6F2FA"/>
  </g>

  <!-- PillowDreamWorks wordmark -->
  <g transform="translate(130, 45)" font-family="'Playfair Display', Georgia, serif">
    <!-- Main text -->
    <text x="0" y="0" font-weight="700" font-size="38" fill="#0B1D30" letter-spacing="-0.5">
      PillowDreamWorks
    </text>

    <!-- Foundation subtitle (smaller, in navy) -->
    <text x="0" y="28" font-weight="600" font-size="14" fill="#5B7C99" letter-spacing="1.5">
      FOUNDATION
    </text>

    <!-- Accent line -->
    <line x1="0" y1="45" x2="85" y2="45" stroke="#C79A4B" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>